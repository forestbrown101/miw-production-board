<meta http-equiv="refresh" content="300"/>
<script>
/* MIW refresh engine. Lives at the TOP of the page so it is armed even if the rest of
   the file is cut off mid-publish or a later script throws. Four layers:
   1. main timer at 290 s: fires just BEFORE the <meta refresh> at 300 s so this reload,
      which saves the week/month picker via window.__miwSnapshot, wins the race;
   2. <meta refresh> at 300 s: browser-level fallback that needs no JavaScript at all;
   3. recovery: Edge throttles or freezes timers in a window that is not in front, which
      is how a board "stops" until someone presses F5. The moment the window becomes
      visible or focused, if the page is older than the refresh interval, reload at once;
   4. watchdog: a 60 s check that reloads if the main timer is overdue by a minute. */
(function(){
  if (window.__miwRefreshArmed) return; window.__miwRefreshArmed = true;
  var REFRESH_MS = 290000, LOADED = Date.now();
  function reload(){ try{ if (window.__miwSnapshot) window.__miwSnapshot(); }catch(e){} location.reload(); }
  function stale(){ return Date.now() - LOADED >= REFRESH_MS; }
  setTimeout(reload, REFRESH_MS);
  setInterval(function(){ if (Date.now() - LOADED >= REFRESH_MS + 60000) reload(); }, 60000);
  function onVisible(){ if (!document.hidden && stale()) reload(); }
  document.addEventListener('visibilitychange', onVisible);
  window.addEventListener('focus', onVisible);
  window.addEventListener('pageshow', function(ev){ if (ev.persisted) reload(); });
})();
</script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#0b0e14;color:#e9edf5;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;}
  .wrap{height:100vh;width:100vw;display:flex;flex-direction:column;padding:2.2vh 2.4vw;}
  .top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1d2433;padding-bottom:1.2vh;}
  .brand{font-size:2.9vh;font-weight:700;letter-spacing:.5px;}
  .brand span{color:#5aa9ff;}
  .week{font-size:2.1vh;color:#9aa6bd;}
  .clock{font-size:2.1vh;color:#9aa6bd;font-variant-numeric:tabular-nums;text-align:right;}
  .upd{font-size:1.4vh;color:#5d6781;}
  /* minmax(0,1fr) not 1fr: a plain 1fr track has an AUTO minimum, so a card with one row too
     many (Paint gained Plant 2 on 2026-09-15) grew the row, the hero grew with it and the
     plant tiles were pushed below the screen. Rows now hold their share; cards clip instead. */
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1.4vh 1.6vw;padding-top:1.4vh;}
  .card{background:#121826;border:1px solid #1d2433;border-radius:14px;padding:1.8vh 1.6vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .label{font-size:1.8vh;color:#9aa6bd;text-transform:uppercase;letter-spacing:1px;}
  .hero{grid-row:1 / span 2;justify-content:space-between;}
  .bignum{font-size:7.9vh;font-weight:800;line-height:1;color:#fff;}
  .midnum{font-size:5.5vh;font-weight:800;line-height:1;color:#fff;}
  .bignum small,.midnum small{font-size:3.0vh;font-weight:600;color:#9aa6bd;}
  .pacelbl{font-size:1.7vh;color:#9aa6bd;margin-top:.5vh;}
  .bar{background:#1d2433;border-radius:9px;height:3.4vh;width:100%;overflow:hidden;margin-top:.7vh;}
  .fill{height:100%;border-radius:9px;display:flex;align-items:center;justify-content:flex-end;padding-right:1.0vw;font-size:2.1vh;font-weight:700;color:#06210f;min-width:3vw;}
  .proj{font-size:1.7vh;color:#9aa6bd;margin-top:.6vh;}
  .sub{display:flex;gap:1.0vw;margin-top:1.0vh;}
  .subcell{flex:1;background:#0e1420;border-radius:10px;padding:.8vh 0;text-align:center;}
  .subname{font-size:1.5vh;color:#9aa6bd;}
  .subval{font-size:2.5vh;font-weight:700;color:#cdd6e6;}
  .plantrow{display:flex;justify-content:space-between;align-items:stretch;gap:1.1vw;margin-top:1.0vh;}
  .plant{flex:1;text-align:center;background:#0e1420;border:1px solid #1d2433;border-radius:12px;padding:1.1vh .7vw;}
  .pname{font-size:1.65vh;color:#9aa6bd;margin-bottom:.5vh;}
  .ptoday{font-size:4.5vh;font-weight:800;line-height:1.02;}
  .pwtd{font-size:1.45vh;color:#7e8aa3;white-space:nowrap;}
  .pstats{display:flex;justify-content:center;align-items:baseline;gap:.55vw;}
  .pconn{font-size:1.6vh;color:#7e8aa3;font-weight:600;}
  .pmh{font-size:4.0vh;font-weight:800;line-height:1.02;}
  .mh{display:flex;gap:1.2vw;align-items:stretch;margin-top:auto;}
  .mhcell{flex:1;text-align:center;background:#0e1420;border-radius:10px;padding:1.4vh 0;}
  .mhname{font-size:1.7vh;color:#9aa6bd;}
  .mhval{font-size:5.0vh;font-weight:800;line-height:1;}
  .good{color:#3ddc84;} .mid{color:#ffc24b;} .bad{color:#ff6b6b;}
  .chartbox{position:relative;flex:1;width:100%;margin-top:1vh;min-height:0;}
  .foot{font-size:1.5vh;color:#5d6781;text-align:right;margin-top:.7vh;}
  .pace{font-size:1.6vh;font-weight:700;padding:.3vh 1vw;border-radius:7px;}
  .ttrow{display:flex;gap:3vw;align-items:flex-end;margin-top:.5vh;}
  .bignum2{font-size:5.4vh;font-weight:800;line-height:1;color:#fff;}
  .ttunit{font-size:1.9vh;color:#9aa6bd;font-weight:600;}
  .pdiv{height:1px;background:#1d2433;margin:1.3vh 0;}
  .psplit{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw;}
  .pcolr{border-left:1px solid #1d2433;padding-left:1.4vw;}
  .phead{font-size:2.2vh;font-weight:800;letter-spacing:.5px;margin-bottom:.8vh;}
  .plabel{font-size:1.4vh;color:#9aa6bd;text-transform:uppercase;letter-spacing:1px;}
  .pval{font-size:3.4vh;font-weight:800;color:#fff;line-height:1.1;margin:.1vh 0 .4vh;}
  .pval small{font-size:1.6vh;color:#9aa6bd;font-weight:600;}
  .pval .pace{font-size:1.25vh;padding:.2vh .7vw;border-radius:6px;vertical-align:middle;margin-left:.3vw;}
  .pbar{background:#1d2433;border-radius:7px;height:2.2vh;overflow:hidden;}
  .pfill{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:.6vw;font-size:1.3vh;font-weight:700;color:#06210f;min-width:2.4vw;}
  .pproj{font-size:1.35vh;color:#9aa6bd;margin-top:.35vh;}
  .cover{display:flex;align-items:center;gap:.6vw;font-size:1.6vh;color:#9aa6bd;flex-wrap:wrap;}
  .coverchip{font-size:2.0vh;font-weight:800;color:#cdd6e6;background:#0e1420;padding:.2vh 1vw;border-radius:8px;}
  .sawtbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  .sawtbl th{font-size:1.5vh;color:#7e8aa3;font-weight:600;text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:.8vh .7vw;border-bottom:1px solid #1d2433;}
  .sawtbl th.sn{text-align:left;}
  .sawtbl td{font-size:2.15vh;text-align:right;padding:.95vh .7vw;color:#e9edf5;line-height:1.08;}
  .sawtbl td .pc{font-size:1.3vh;color:#7e8aa3;font-weight:600;}
  .sawtbl td .tu{font-size:1.2vh;color:#7e8aa3;font-weight:600;margin-left:1px;}
  .sawtbl tbody tr:nth-child(odd){background:rgba(255,255,255,.022);}
  .sawtbl td.sn{text-align:left;font-weight:700;white-space:nowrap;padding-left:.8vw;}
  .sawtbl td.z{color:#3d4560;}
  .sawtbl .today{background:#132741;}
  .sawtbl td.tot{font-weight:800;color:#fff;}
  .sawtbl tfoot td{border-top:2px solid #26314a;color:#9aa6bd;font-weight:700;}
  .sawtbl tfoot td.tot{color:#fff;}
  /* 2026-09-29: Sun column + Unassigned row. The saw table now carries up to 8 day/total
     columns and 6 saw rows plus the footer, so it is tightened to stay inside its card on 1080p. */
  #sawtbl th{padding:.55vh .45vw;}
  #sawtbl td{padding:.5vh .45vw;font-size:2.0vh;line-height:1.02;}
  #sawtbl td.sn{padding-left:.6vw;}
  #sawtbl td .pc{font-size:1.15vh;}
  #qctbl th,#qctbl td,#painttbl th,#painttbl td{padding-left:.45vw;padding-right:.45vw;}
  /* 2026-09-29: hover tooltip on the saw table, job number and tons behind each number. */
  #sawtbl td[data-d]{cursor:default;}
  #sawtbl td[data-d]:hover{box-shadow:inset 0 0 0 1px #3a4a6b;border-radius:4px;}
  #cutTip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;display:none;
    --acc:#5aa9ff;min-width:15vw;max-width:24vw;padding:1.05vh 1.05vw .95vh;
    background:linear-gradient(180deg,#1d2639 0%,#161d2c 100%);
    border:1px solid #2c3852;border-top:3px solid var(--acc);border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.04);
    font-variant-numeric:tabular-nums;opacity:0;transform:translateY(5px);
    transition:opacity 110ms ease-out,transform 110ms ease-out;}
  #cutTip.show{display:block;}
  #cutTip.in{opacity:1;transform:none;}
  #cutTip.down{transform:translateY(-5px);}
  #cutTip.down.in{transform:none;}
  #cutTip .hd{display:flex;align-items:baseline;justify-content:space-between;gap:1.2vw;
    padding-bottom:.65vh;margin-bottom:.75vh;border-bottom:1px solid #26314a;}
  #cutTip .hl{font-size:1.3vh;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8d99b3;white-space:nowrap;}
  #cutTip .hl b{color:var(--acc);font-weight:800;}
  #cutTip .ht{font-size:2.1vh;font-weight:800;color:#fff;white-space:nowrap;}
  #cutTip .ht small,#cutTip .v small{font-size:1.15vh;color:#7e8aa3;font-weight:700;margin-left:2px;}
  #cutTip .row{margin-bottom:.65vh;}
  #cutTip .row:last-of-type{margin-bottom:.1vh;}
  #cutTip .ln{display:flex;align-items:baseline;gap:.6vw;white-space:nowrap;}
  #cutTip .j{font-size:1.8vh;font-weight:800;color:#fff;}
  #cutTip .n{font-size:1.4vh;color:#9aa6bd;font-weight:600;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  #cutTip .v{font-size:1.8vh;font-weight:800;color:#fff;margin-left:auto;}
  #cutTip .bar{display:flex;align-items:center;gap:.5vw;margin-top:.35vh;}
  #cutTip .trk{flex:1;height:4px;border-radius:2px;background:#0e1420;overflow:hidden;}
  #cutTip .fil{height:100%;border-radius:2px;background:var(--acc);}
  #cutTip .pct{font-size:1.15vh;font-weight:700;color:#7e8aa3;min-width:2.6vw;text-align:right;}
  #cutTip .more{font-size:1.3vh;color:#7e8aa3;font-weight:600;margin-top:.5vh;}
  #cutTip .ar{position:absolute;width:10px;height:10px;transform:rotate(45deg);}
  #cutTip.up .ar{bottom:-6px;background:#161d2c;border-right:1px solid #2c3852;border-bottom:1px solid #2c3852;}
  #cutTip.down .ar{top:-7px;background:var(--acc);}
  /* QC + Paint share one card: 4 + 3 body rows. Tighter than the saw table so all fit. */
  #qctbl th,#painttbl th{padding:.5vh .7vw;}
  #qctbl td,#painttbl td{padding:.4vh .7vw;font-size:1.95vh;line-height:1;}
  #qctbl td .pc,#painttbl td .pc{font-size:1.15vh;line-height:1;margin-top:.15vh;}
  .picker{display:flex;align-items:center;gap:.7vw;justify-content:center;}
  .ptab{background:#121826;border:1px solid #1d2433;color:#9aa6bd;font-size:1.9vh;font-weight:700;padding:.5vh 1.3vw;border-radius:9px;cursor:pointer;font-family:inherit;}
  .ptab.on{background:#12243a;color:#5aa9ff;border-color:#2a4a6b;}
  #perSel{background:#121826;border:1px solid #1d2433;color:#e9edf5;font-size:1.9vh;font-weight:700;padding:.5vh 1vw;border-radius:9px;font-family:inherit;min-width:15vw;}
</style>
</head>

  <div class="top">
    <div class="brand">MERCHANT IRON WORKS <span id="scopetag">· PRODUCTION</span></div>
    <div class="picker"><button id="tabWeek" class="ptab on">Weekly</button><button id="tabMonth" class="ptab">Monthly</button><select id="perSel"></select><span id="week" style="display:none"></span></div>
    <div><div class="clock" id="clock">--:--</div><div class="upd" id="upd"></div></div>
  </div>
  <div class="grid">
    <div class="card hero">
      <div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const HIST = __HISTORY_JSON__;
const COLORS = {P1:'#5aa9ff', P2:'#b98cff', P3:'#3ddc84', P4:'#F56600'};
const SAWC = {S1:'#5aa9ff', S2:'#5aa9ff', S3:'#5aa9ff', S4:'#5aa9ff', S5:'#F56600'};
let chart = null;
function mhClass(v){ return v==null?'':(v<=20?'good':v<=30?'mid':'bad'); }
function num(v,d=1){ return v==null?'—':Number(v).toFixed(d); }
function barColor(p){ return p>=90?'#3ddc84':p>=60?'#ffc24b':'#ff6b6b'; }
function setBar(id,pct){ const el=document.getElementById(id); if(pct==null){el.style.width='0%';el.textContent='';return;} el.style.width=Math.min(pct,100)+'%'; el.textContent=pct+'%'; el.style.background=barColor(pct); }
function chipHTML(on){ return '<span class="pace" style="background:'+(on?'#103a23':'#3a1414')+';color:'+(on?'#3ddc84':'#ff6b6b')+';">'+(on?'ON PACE':'BEHIND')+'</span>'; }
function renderPlant(pre, p, elapsed, total){
  document.getElementById(pre+'fit').innerHTML = num(p.fit_wtd)+'<small> / '+p.fit_goal+' goal</small>'+(p.fit_on_pace==null?'':chipHTML(p.fit_on_pace));
  setBar(pre+'fitbar', p.fit_pct);
  document.getElementById(pre+'fitproj').textContent = 'Projected '+Math.round(p.fit_proj||0)+' t · need '+num(p.fit_expected)+' by now ('+elapsed+'/'+total+' days)';
  if(p.cut_wtd==null){
    document.getElementById(pre+'cut').innerHTML = '<small style="color:#7e8aa3">cut not split before saws</small>';
    setBar(pre+'cutbar', null);
    document.getElementById(pre+'cutproj').textContent = '';
  } else {
    document.getElementById(pre+'cut').innerHTML = num(p.cut_wtd)+'<small> / '+p.cut_goal+' goal</small>';
    setBar(pre+'cutbar', p.cut_pct);
    document.getElementById(pre+'cutproj').textContent = 'Projected '+Math.round(p.cut_proj||0)+' t at current pace';
  }
}

/* ---- Saw table tooltip (Forest 2026-09-29) ----------------------------------------------
   Hover any number in the Saws table: after 12 ms a small box shows the job numbers and tons
   behind it, with an arrow pointing at the number. Day cells show that saw on that day; the
   Total column shows the saw for the period; the footer row shows every listed saw combined.
   Data: saws[].daily_jobs[bucket] = [[job, tons], ...] from build_production_json.py.
   One element, event delegation on the table, so it survives every re-render. */
var CUT_TIP_DELAY_MS = 12, cutTipTimer = null, cutTipCell = null;
function cutTipEl(){
  var t = document.getElementById('cutTip');
  if (!t){ t = document.createElement('div'); t.id = 'cutTip'; document.body.appendChild(t); }
  return t;
}
function cutTipHide(){
  if (cutTipTimer){ clearTimeout(cutTipTimer); cutTipTimer = null; }
  cutTipCell = null;
  var t = document.getElementById('cutTip'); if (t) t.className = '';
}
function cutTipJobs(si, di){
  var rows = window.__sawRows || [], acc = {};
  var saws = (si === 'all') ? rows : [rows[+si]];
  saws.forEach(function(s){
    if (!s || !s.daily_jobs) return;
    var buckets = (di === 't') ? s.daily_jobs : [s.daily_jobs[+di] || []];
    buckets.forEach(function(b){ (b || []).forEach(function(p){ acc[p[0]] = (acc[p[0]] || 0) + p[1]; }); });
  });
  return Object.keys(acc).map(function(j){ return [j, acc[j]]; })
               .filter(function(p){ return p[1] >= 0.05; })
               .sort(function(a, b){ return b[1] - a[1]; });
}
var CUT_TIP_MAX_ROWS = 7;
function cutTipEls(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function cutTipShow(td){
  var si = td.getAttribute('data-s'), di = td.getAttribute('data-d');
  var jobs = cutTipJobs(si, di);
  if (!jobs.length) return;
  var rows = window.__sawRows || [], days = window.__sawDays || [], names = window.__jobNames || {};
  var saw = (si === 'all') ? null : rows[+si];
  var acc = saw ? (COLORS[saw.plant] || '#9aa6bd') : '#cdd6e6';
  var who = saw ? saw.name : 'All saws';
  var when = (di === 't') ? (window.__sawScope === 'month' ? 'Month' : 'Week')
           : (function(d){ if (!d) return ''; return /^Wk/.test(d.label) ? d.label : (d.label + ' ' + (d.date || '')); })(days[+di]);
  var total = jobs.reduce(function(a, p){ return a + p[1]; }, 0);
  var t = cutTipEl(); t.textContent = ''; t.style.setProperty('--acc', acc);
  // header: SAW 1 · MON 9/28 ............ 51.3 t
  var hd = cutTipEls('div', 'hd'), hl = cutTipEls('div', 'hl');
  hl.appendChild(cutTipEls('b', null, who)); hl.appendChild(document.createTextNode(' \u00b7 ' + when));
  var ht = cutTipEls('div', 'ht', total.toFixed(1)); ht.appendChild(cutTipEls('small', null, 't'));
  hd.appendChild(hl); hd.appendChild(ht); t.appendChild(hd);
  // one row per job: number, name, tons, then a share bar
  var shown = jobs.slice(0, CUT_TIP_MAX_ROWS), rest = jobs.slice(CUT_TIP_MAX_ROWS);
  shown.forEach(function(p){
    var share = total > 0 ? p[1] / total * 100 : 0;
    var row = cutTipEls('div', 'row'), ln = cutTipEls('div', 'ln');
    ln.appendChild(cutTipEls('span', 'j', p[0]));
    ln.appendChild(cutTipEls('span', 'n', names[p[0]] || ''));
    var v = cutTipEls('span', 'v', p[1].toFixed(1)); v.appendChild(cutTipEls('small', null, 't')); ln.appendChild(v);
    var bar = cutTipEls('div', 'bar'), trk = cutTipEls('div', 'trk'), fil = cutTipEls('div', 'fil');
    fil.style.width = Math.max(2, share).toFixed(1) + '%'; trk.appendChild(fil); bar.appendChild(trk);
    bar.appendChild(cutTipEls('span', 'pct', share < 1 ? '<1%' : Math.round(share) + '%'));
    row.appendChild(ln); if (jobs.length > 1) row.appendChild(bar);   // one job = 100%, the bar adds nothing
    t.appendChild(row);
  });
  if (rest.length){
    var rt = rest.reduce(function(a, p){ return a + p[1]; }, 0);
    t.appendChild(cutTipEls('div', 'more', '+' + rest.length + ' more job' + (rest.length > 1 ? 's' : '') + ' \u00b7 ' + rt.toFixed(1) + ' t'));
  }
  t.appendChild(cutTipEls('div', 'ar'));
  t.className = 'show up';                                   // measure first, then place
  var r = td.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight, gap = 10, pad = 6;
  var cx = r.left + r.width / 2;
  var left = Math.max(pad, Math.min(cx - w / 2, window.innerWidth - w - pad));
  var top = r.top - h - gap, dir = 'up';
  if (top < pad){ top = r.bottom + gap; dir = 'down'; }       // no room above: open below
  t.className = 'show ' + dir;
  t.style.left = Math.round(left) + 'px';
  t.style.top = Math.round(top) + 'px';
  t.querySelector('.ar').style.left = Math.round(Math.max(10, Math.min(cx - left - 5, w - 20))) + 'px';
  void t.offsetWidth; t.classList.add('in');                 // fade + lift in
}
(function(){
  var tbl = document.getElementById('sawtbl');
  if (!tbl) return;
  tbl.addEventListener('mouseover', function(e){
    var td = e.target.closest ? e.target.closest('td[data-d]') : null;
    if (td === cutTipCell) return;
    cutTipHide();
    if (!td) return;
    cutTipCell = td;
    cutTipTimer = setTimeout(function(){ cutTipTimer = null; if (cutTipCell === td) cutTipShow(td); }, CUT_TIP_DELAY_MS);
  });
  tbl.addEventListener('mouseleave', cutTipHide);
  window.addEventListener('scroll', cutTipHide, true);
  window.addEventListener('resize', cutTipHide);
})();

function render(D){
  document.getElementById('scopetag').textContent = '· '+(D.scope==='month'?'MONTHLY':'WEEKLY');
  document.getElementById('week').textContent = D.week_label;
  document.getElementById('fitperiod').textContent = D.period_label;
  document.getElementById('todaytag').textContent = '· as of '+D.today_label;
  const t = D.totals;
  document.getElementById('topfit').textContent = num(D.top.fit_wtd);
  document.getElementById('topcut').textContent = num(D.top.cut_wtd);
  renderPlant('p1', D.p1, t.elapsed_days, t.total_days);
  renderPlant('p4', D.p4, t.elapsed_days, t.total_days);
  document.getElementById('hours').textContent = Math.round(t.hours_wtd).toLocaleString();
  document.getElementById('omh').textContent = num(t.mhton);

  document.getElementById('plantrow').innerHTML = D.plants.filter(p=>p.key!=='P3').map(p=>
    `<div class="plant"><div class="pname">${p.name}</div>
      <div class="pstats">
        <div><div class="ptoday" style="color:${COLORS[p.key]||'#fff'}">${num(p.fit_today)}</div><div class="pwtd">${D.tile_big} · ${num(p.fit_wtd)} ${D.tile_small}</div></div>
        <div class="pconn">tons at</div>
        <div><div class="pmh" style="color:${COLORS[p.key]||'#fff'}">${num(p.mhton_today)}</div><div class="pwtd">MH / Ton · ${D.tile_big}</div></div>
      </div>
    </div>`).join('');

  document.getElementById('jobsperiod').textContent = (D.scope==='month'?'this month':'this week');
  const aj = D.active_jobs||[];
  const jmax = Math.max(1, ...aj.map(j=>j.tons));
  document.getElementById('jobs').innerHTML = aj.map(j=>{
    const segs=[['P1',j.p1||0,'#5aa9ff'],['P3',j.p3||0,'#3ddc84'],['P4',j.p4||0,'#F56600']].filter(x=>x[1]>0);
    const tot=segs.reduce((a,x)=>a+x[1],0)||j.tons||1;
    const tag=segs.map(x=>`<span style="color:${x[2]}">${x[0]}</span>`).join('<span style="color:#5d6781"> · </span>')||'—';
    const fills=segs.map(x=>`<div style="width:${(x[1]/tot*100).toFixed(1)}%;background:${x[2]};"></div>`).join('');
    return `<div style="display:flex;align-items:center;gap:.8vw;padding:.45vh 0;">
      <div style="font-size:2.2vh;font-weight:700;width:5vw;font-variant-numeric:tabular-nums;">${j.job}</div>
      <div style="font-size:1.5vh;font-weight:700;width:5.4vw;white-space:nowrap;">${tag}</div>
      <div style="flex:0 0 12.5vw;min-width:0;font-size:1.8vh;color:#cdd6e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${j.name}</div>
      <div style="flex:1;height:1.7vh;background:#0e1420;border-radius:6px;overflow:hidden;">
        <div style="height:100%;width:${(j.tons/jmax*100).toFixed(0)}%;display:flex;border-radius:6px;overflow:hidden;">${fills}</div>
      </div>
      <div style="font-size:2.2vh;font-weight:800;white-space:nowrap;margin-left:.8vw;font-variant-numeric:tabular-nums;">${num(j.tons)}<span style="font-size:1.3vh;color:#9aa6bd;"> t</span></div>
    </div>`;}).join('');

  document.getElementById('sawperiod').textContent = (D.scope==='month'?'this month':'this week');
  const sw = D.saws||[];
  const days = D.days.map(d=>d.label);
  const ti = D.today_index;
  // data-s = saw row index or "all" (footer); data-d = day index or "t" (total column). Used by the tooltip.
  const cell=(tn,pc,cls,u,si,di)=> (tn>0||pc>0) ? `<td class="${cls||''}"${si!==undefined?` data-s="${si}" data-d="${di}"`:''}><div>${num(tn)}${u?'<span class="tu">t</span>':''}</div><div class="pc">${pc} pc</div></td>` : `<td class="z ${cls||''}">—</td>`;
  let html = '<thead><tr><th class="sn">Saw</th>'+days.map((d,i)=>`<th class="${i===ti?'today':''}">${d}</th>`).join('')+'<th>Total</th></tr></thead><tbody>';
  sw.forEach((s,si)=>{
    const pc = COLORS[s.plant]||'#7e8aa3';
    html += `<tr><td class="sn" style="border-left:3px solid ${pc}"><span style="color:${pc}">${s.name}</span> <span style="font-size:1.3vh;color:${pc};font-weight:700"> ${s.plant}</span></td>`;
    (s.daily||[]).forEach((v,i)=>{ html += cell(v, (s.daily_pc&&s.daily_pc[i])||0, i===ti?'today':'', false, si, i); });
    html += cell(s.tons_wtd, s.pieces_wtd, 'tot', true, si, 't')+'</tr>';
  });
  html += '</tbody><tfoot>';
  const colT = days.map((_,i)=> sw.reduce((a,s)=> a+((s.daily&&s.daily[i])||0), 0));
  const colP = days.map((_,i)=> sw.reduce((a,s)=> a+((s.daily_pc&&s.daily_pc[i])||0), 0));
  const gT = sw.reduce((a,s)=> a+(s.tons_wtd||0), 0);
  const gP = sw.reduce((a,s)=> a+(s.pieces_wtd||0), 0);
  html += '<tr><td class="sn">Total</td>';
  colT.forEach((v,i)=>{ html += cell(v, colP[i], (i===ti?'today ':'')+'tt', true, 'all', i); });
  html += cell(gT, gP, 'tot', true, 'all', 't')+'</tr></tfoot>';
  document.getElementById('sawtbl').innerHTML = html;
  window.__sawRows = sw; window.__sawDays = D.days||[]; window.__jobNames = D.job_names||{}; window.__sawScope = D.scope; cutTipHide();

  document.getElementById('qcperiod').textContent = (D.scope==='month'?'this month':'this week');
  const qp = (D.plants||[]).filter(p=>p.key==='P1'||p.key==='P4');
  const qdays = D.days.map(d=>d.label);
  const qti = D.today_index;
  const qcell=(tn,pc,cls,u)=> (tn>0||pc>0) ? `<td class="${cls||''}"><div>${num(tn)}${u?'<span class="tu">t</span>':''}</div><div class="pc">${pc} pc</div></td>` : `<td class="z ${cls||''}">—</td>`;
  let qh = '<thead><tr><th class="sn">Plant</th>'+qdays.map((d,i)=>`<th class="${i===qti?'today':''}">${d}</th>`).join('')+'<th>Total</th></tr></thead><tbody>';
  qp.forEach(p=>{
    const c = COLORS[p.key]||'#7e8aa3';
    qh += `<tr><td class="sn" style="border-left:3px solid ${c}"><span style="color:${c}">${p.name}</span></td>`;
    (p.daily_fit||[]).forEach((v,i)=>{ qh += qcell(v, (p.daily_fit_pc&&p.daily_fit_pc[i])||0, i===qti?'today':''); });
    qh += qcell(p.fit_wtd, p.fit_pc_wtd||0, 'tot', true)+'</tr>';
  });
  qh += '</tbody><tfoot>';
  const qcolT = qdays.map((_,i)=> qp.reduce((a,p)=> a+((p.daily_fit&&p.daily_fit[i])||0), 0));
  const qcolP = qdays.map((_,i)=> qp.reduce((a,p)=> a+((p.daily_fit_pc&&p.daily_fit_pc[i])||0), 0));
  const qgT = qp.reduce((a,p)=> a+(p.fit_wtd||0), 0);
  const qgP = qp.reduce((a,p)=> a+(p.fit_pc_wtd||0), 0);
  qh += '<tr><td class="sn">Total</td>';
  qcolT.forEach((v,i)=>{ qh += qcell(v, qcolP[i], i===qti?'today':''); });
  qh += qcell(qgT, qgP, 'tot', true)+'</tr></tfoot>';
  document.getElementById('qctbl').innerHTML = qh;

  document.getElementById('paintperiod').textContent = (D.scope==='month'?'this month':'this week');
  const pt = D.paint||[]; const pdays = D.days.map(d=>d.label); const pti = D.today_index;
  let ph = '<thead><tr><th class="sn">Plant</th>'+pdays.map((d,i)=>`<th class="${i===pti?'today':''}">${d}</th>`).join('')+'<th>Total</th></tr></thead><tbody>';
  pt.forEach(p=>{
    const c = COLORS[p.plant]||'#7e8aa3';
    ph += `<tr><td class="sn" style="border-left:3px solid ${c}"><span style="color:${c}">${p.name}</span></td>`;
    (p.daily||[]).forEach((v,i)=>{ ph += qcell(v, (p.daily_pc&&p.daily_pc[i])||0, i===pti?'today':''); });
    ph += qcell(p.tons_wtd, p.pc_wtd||0, 'tot', true)+'</tr>';
  });
  ph += '</tbody><tfoot>';
  const ptc=pdays.map((_,i)=>pt.reduce((a,p)=>a+((p.daily&&p.daily[i])||0),0));
  const ppc=pdays.map((_,i)=>pt.reduce((a,p)=>a+((p.daily_pc&&p.daily_pc[i])||0),0));
  ph += '<tr><td class="sn">Total</td>';
  ptc.forEach((v,i)=>{ ph += qcell(v, ppc[i], i===pti?'today':''); });
  ph += qcell(pt.reduce((a,p)=>a+(p.tons_wtd||0),0), pt.reduce((a,p)=>a+(p.pc_wtd||0),0), 'tot', true)+'</tr></tfoot>';
  document.getElementById('painttbl').innerHTML = ph;

  document.getElementById('upd').textContent = 'updated '+D.generated_at.split(' ')[1];
  document.getElementById('foot').textContent = 'Source: PowerFab (fit/cut) + QuickBooks (hours) · data as of '+D.generated_at;

}
let mode='week';
function periods(){ return mode==='week'?HIST.weeks:HIST.months; }
function curKey(){ return mode==='week'?HIST.current_week:HIST.current_month; }
function fillPicker(k){
  const sel=document.getElementById('perSel');
  const ps=periods().slice().reverse();
  sel.innerHTML=ps.map(p=>`<option value="${p.key}">${p.label}${p.key===curKey()?' (current)':''}</option>`).join('');
  sel.value=k||curKey();
}
function showSel(){ const k=document.getElementById('perSel').value; const p=periods().find(x=>x.key===k); if(p) render(p.data); }
function setMode(m){ mode=m;
  document.getElementById('tabWeek').classList.toggle('on',m==='week');
  document.getElementById('tabMonth').classList.toggle('on',m==='month');
  fillPicker(curKey()); showSel(); }
document.getElementById('tabWeek').onclick=()=>setMode('week');
document.getElementById('tabMonth').onclick=()=>setMode('month');
document.getElementById('perSel').onchange=showSel;
function tick(){ const d=new Date(); document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,30000);
setMode('week');
function tick(){ const n=new Date(); document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,30000);

// ---- auto refresh -------------------------------------------------------
// The file on disk is rebuilt every 5 minutes. Reload every 5 minutes to pick
// up the new build, no exceptions, because a board that is not current is not
// doing its job. Before reloading we stash the Weekly/Monthly choice, the
// period picker and the scroll position in the URL hash, and restore them on
// the way back in, so a refresh does not move what anyone is looking at.
(function(){
  var REFRESH_MS = 300000;

  function snapshot(){
    try{
      var sel = document.getElementById('perSel');
      var m   = document.getElementById('tabMonth').classList.contains('on') ? 'month' : 'week';
      location.hash = 'v=' + m
                    + '&p=' + encodeURIComponent(sel ? sel.value : '')
                    + '&y=' + Math.round(window.scrollY || 0);
    }catch(e){}
  }

  function restore(){
    var h = location.hash.replace(/^#/,'');
    if (!h) return;
    var q = {};
    h.split('&').forEach(function(kv){
      var i = kv.indexOf('=');
      if (i > 0) { q[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1)); }
    });
    try{
      if (q.v === 'month' || q.v === 'week') { setMode(q.v); }
      var sel = document.getElementById('perSel');
      if (sel && q.p){
        for (var i=0; i<sel.options.length; i++){
          if (sel.options[i].value === q.p){ sel.selectedIndex = i; showSel(); break; }
        }
      }
      if (q.y) { window.scrollTo(0, parseInt(q.y,10) || 0); }
    }catch(e){}
  }

  restore();
  // Reload timing now lives in the refresh engine at the top of the page (armed before
  // anything here can fail). We only hand it the snapshot so the picker survives a reload.
  window.__miwSnapshot = snapshot;
})();
