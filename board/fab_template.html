<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#0b0e14;color:#e9edf5;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;}
  .wrap{height:100vh;width:100vw;display:flex;flex-direction:column;padding:2.0vh 2.2vw;}
  .top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1d2433;padding-bottom:1.0vh;}
  .brand{font-size:2.9vh;font-weight:700;letter-spacing:.5px;}
  .brand span{color:#3ddc84;}
  .week{font-size:2.0vh;color:#9aa6bd;}
  .clock{font-size:2.0vh;color:#9aa6bd;font-variant-numeric:tabular-nums;text-align:right;}
  .upd{font-size:1.3vh;color:#5d6781;text-align:right;}

  .kpis{display:grid;grid-template-columns:1.7fr 1fr 1fr 1.5fr;gap:1.2vw;padding-top:1.2vh;}
  .card{background:#121826;border:1px solid #1d2433;border-radius:14px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .label{font-size:1.55vh;color:#9aa6bd;text-transform:uppercase;letter-spacing:1px;}
  .kbig{font-size:5.4vh;font-weight:800;line-height:1.02;color:#fff;font-variant-numeric:tabular-nums;}
  .kbig small{font-size:1.9vh;font-weight:600;color:#9aa6bd;}
  .bar{background:#1d2433;border-radius:7px;height:2.1vh;width:100%;overflow:hidden;margin-top:.6vh;}
  .fill{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:.6vw;font-size:1.3vh;font-weight:700;color:#06210f;min-width:2.4vw;}
  .note{font-size:1.3vh;color:#9aa6bd;margin-top:.45vh;}
  .pace{font-size:1.25vh;font-weight:700;padding:.2vh .7vw;border-radius:6px;vertical-align:middle;margin-left:.4vw;}
  .wkrow{display:flex;gap:1.0vw;margin-top:.5vh;}
  .wkcell{flex:1;background:#0e1420;border-radius:10px;padding:.8vh .3vw;text-align:center;}
  .wkname{font-size:1.3vh;color:#9aa6bd;}
  .wkval{font-size:3.0vh;font-weight:800;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums;}
  .good{color:#3ddc84;} .mid{color:#ffc24b;} .bad{color:#ff6b6b;}

  .stack{flex:1;display:flex;flex-direction:column;gap:1.2vh;padding-top:1.2vh;min-height:0;}
  .gcard{flex:1;display:flex;flex-direction:column;min-height:0;}
  .tw{flex:1;min-height:0;display:flex;}
  .tbl{width:100%;height:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:.5vh;}
  .tbl th{font-size:1.7vh;color:#7e8aa3;font-weight:600;text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:.6vh .6vw;border-bottom:1px solid #1d2433;height:1px;}
  .tbl th.sn{text-align:left;padding-left:.8vw;}
  .tbl th.today{background:#132741;color:#cdd6e6;}
  .tbl td{text-align:right;padding:.55vh .6vw;line-height:1.12;}
  .tbl td.sn{text-align:left;font-weight:700;white-space:nowrap;padding-left:.8vw;font-size:2.9vh;}
  .tbl tbody tr:nth-child(odd){background:rgba(255,255,255,.022);}
  .tbl .today{background:#132741;}
  .tbl tfoot td{border-top:2px solid #26314a;}
  .ct{font-size:3.1vh;font-weight:700;color:#e9edf5;}
  .ct .tu{font-size:1.5vh;color:#7e8aa3;font-weight:600;margin-left:1px;}
  .ch{font-size:1.7vh;color:#7e8aa3;font-weight:600;}
  .cm{font-size:1.75vh;font-weight:800;}
  .z{color:#3d4560;font-size:2.8vh;}
  td.tot .ct{color:#fff;font-weight:800;font-size:3.4vh;}
  tfoot .ct{color:#fff;font-weight:800;}
  .legend{font-size:1.25vh;color:#5d6781;}
  .foot{font-size:1.3vh;color:#5d6781;text-align:right;margin-top:.5vh;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">MERCHANT IRON WORKS <span>· FABRICATION</span></div>
    <div class="week" id="hdr">—</div>
    <div><div class="clock" id="clock">--:--</div><div class="upd" id="upd"></div></div>
  </div>

  <div class="kpis">
    <div class="card">
      <div class="label">Month · fit tons</div>
      <div class="kbig" id="mtons">—<small id="mgoal"></small><span id="mchip"></span></div>
      <div class="bar"><div class="fill" id="mbar">—</div></div>
      <div class="note" id="mnote"></div>
    </div>
    <div class="card">
      <div class="label">Month · man hours</div>
      <div class="kbig" id="mhrs">—</div>
      <div class="note" id="mhrsnote"></div>
    </div>
    <div class="card">
      <div class="label">Month · MH per ton</div>
      <div class="kbig" id="mmh">—</div>
      <div class="note">green &le;20 · amber &le;30 · red &gt;30</div>
    </div>
    <div class="card">
      <div class="label">This week · <span id="wklbl"></span></div>
      <div class="wkrow">
        <div class="wkcell"><div class="wkval" id="wtons">—</div><div class="wkname">Fit tons</div></div>
        <div class="wkcell"><div class="wkval" id="whrs">—</div><div class="wkname">Man hours</div></div>
        <div class="wkcell"><div class="wkval" id="wmh">—</div><div class="wkname">MH / ton</div></div>
      </div>
      <div class="note" id="wnote"></div>
    </div>
  </div>

  <div class="stack">
    <div class="card gcard">
      <div class="label">Month by week &nbsp;<span class="legend">tons &middot; man hours &middot; MH per ton</span></div>
      <div class="tw"><table class="tbl" id="mtbl"></table></div>
    </div>
    <div class="card gcard">
      <div class="label">This week by day &nbsp;<span class="legend">tons &middot; man hours &middot; MH per ton</span></div>
      <div class="tw"><table class="tbl" id="wtbl"></table></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const DATA_FILE = '__DATA_FILE__';
const FALLBACK  = __FALLBACK_JSON__;
const COLORS = {P1:'#5aa9ff', P3:'#3ddc84', P4:'#F56600', ALL:'#cdd6e6'};
let TH = {green:20, amber:30};

function num(v,d=1){ return (v==null)?'—':Number(v).toFixed(d); }
function int(v){ return (v==null)?'—':Math.round(v).toLocaleString(); }
function mhClass(v){ return v==null?'':(v<=TH.green?'good':v<=TH.amber?'mid':'bad'); }
function barColor(p){ return p>=90?'#3ddc84':p>=60?'#ffc24b':'#ff6b6b'; }
function setBar(id,pct){ const el=document.getElementById(id); el.style.width=Math.min(pct,100)+'%'; el.textContent=pct+'%'; el.style.background=barColor(pct); }
function chip(on){ return '<span class="pace" style="background:'+(on?'#103a23':'#3a1414')+';color:'+(on?'#3ddc84':'#ff6b6b')+';">'+(on?'ON PACE':'BEHIND')+'</span>'; }

function cell(c, cls){
  if(!c || (!c.tons && !c.hours)) return '<td class="z '+(cls||'')+'">—</td>';
  const mh = (c.mhton==null) ? '&nbsp;' : num(c.mhton)+' MH/t';
  return '<td class="'+(cls||'')+'">'
       + '<div class="ct">'+num(c.tons)+'<span class="tu">t</span></div>'
       + '<div class="ch">'+int(c.hours)+' hrs</div>'
       + '<div class="cm '+mhClass(c.mhton)+'">'+mh+'</div></td>';
}

function grid(el, G, ti, totLabel){
  let h = '<thead><tr><th class="sn">Plant</th>';
  G.cols.forEach((c,i)=>{ h += '<th class="'+(i===ti?'today':'')+'">'+c+'</th>'; });
  h += '<th>'+totLabel+'</th></tr></thead><tbody>';
  G.rows.forEach(r=>{
    const pc = COLORS[r.key]||'#7e8aa3';
    h += '<tr><td class="sn" style="border-left:3px solid '+pc+';color:'+pc+'">'+r.name+'</td>';
    r.cells.forEach((c,i)=>{ h += cell(c, i===ti?'today':''); });
    h += cell(r.total,'tot')+'</tr>';
  });
  h += '</tbody><tfoot><tr><td class="sn" style="border-left:3px solid #cdd6e6">Total</td>';
  const T = G.total_row;
  T.cells.forEach((c,i)=>{ h += cell(c, i===ti?'today':''); });
  h += cell(T.total,'tot')+'</tr></tfoot>';
  document.getElementById(el).innerHTML = h;
}

function render(D){
  TH = D.thresholds || TH;
  const g = D.goals, m = D.month.total_row.total, w = D.week.total_row.total;

  document.getElementById('hdr').textContent = D.month_label + '  ·  as of ' + D.as_of;
  document.getElementById('wklbl').textContent = D.week_label;

  const onPace = m.tons >= g.month_expected;
  document.getElementById('mtons').innerHTML = num(m.tons)
      + '<small> / '+g.month_tons.toLocaleString()+' goal</small>' + chip(onPace);
  setBar('mbar', g.month_pct);
  document.getElementById('mnote').textContent =
      'Projected '+Math.round(g.month_proj).toLocaleString()+' t · need '
      + Math.round(g.month_expected).toLocaleString()+' by now ('+g.elapsed_days+'/'+g.total_days+' days)';

  document.getElementById('mhrs').textContent = int(m.hours);
  document.getElementById('mhrsnote').textContent =
      (D.hours_mode==='bays' ? 'Fitting areas only' : 'All Plant 1 and Plant 4 departments');

  const mmh = document.getElementById('mmh');
  mmh.textContent = num(m.mhton);
  mmh.className = 'kbig ' + mhClass(m.mhton);

  document.getElementById('wtons').textContent = num(w.tons);
  document.getElementById('whrs').textContent  = int(w.hours);
  const wmh = document.getElementById('wmh');
  wmh.textContent = num(w.mhton);
  wmh.className = 'wkval ' + mhClass(w.mhton);
  document.getElementById('wnote').textContent =
      'Projected '+Math.round(g.week_proj).toLocaleString()+' t · goal '+g.week_tons.toLocaleString()+' t/wk';

  grid('mtbl', D.month, D.month_today_index, 'Month');
  grid('wtbl', D.week,  D.week_today_index,  'Week');

  document.getElementById('upd').textContent = 'updated ' + D.generated_at.split(' ')[1];
  document.getElementById('foot').textContent =
      'Fit tons: PowerFab QC Final · Man hours: QuickBooks Time · data as of ' + D.generated_at;
}

async function load(){
  try{ const r = await fetch(DATA_FILE+'?_='+Date.now(), {cache:'no-store'}); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ return FALLBACK; }
}
function refresh(){ load().then(render); }
const FILE_MODE = (location.protocol === 'file:');
refresh();
// When the board is opened straight from the file (no web server), fetch is blocked,
// so the page renders the snapshot baked in at build time. Reloading the file every
// 5 minutes picks up the newest build instead of sitting frozen.
setInterval(function(){ if (FILE_MODE) { location.reload(); } else { refresh(); } }, 300000);
function tick(){ const n=new Date(); document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,30000);
</script>
</body>
</html>
